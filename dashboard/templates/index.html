<!DOCTYPE html>
<html>

<head>

<title>DARREL V0.2</title>

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}"
>

</head>


<body>


<h1>DARREL V0.2</h1>

<h3>Synthetic Cognitive System</h3>


<select id="questionPreset" onchange="loadPresetQuestion()">

<option value="">
Select a test question...
</option>

<option value="What is 2 plus 2?">
SIMPLE — What is 2 plus 2?
</option>

<option value="Should SCS use multiple specialised AI agents?">
MEDIUM — Multiple AI agents?
</option>

<option value="Design three innovative features for a future AI assistant.">
CREATIVE — AI features
</option>

</select>


<textarea
id="question"
placeholder="Ask DARREL..."
></textarea>


<button
id="startPulse"
onclick="runSCS()"
>
START PULSE
</button>



<div class="answer-card">

<h2>🤖 DARREL Response</h2>

<p id="darrelAnswer">
Waiting for cognitive pulse...
</p>

</div>




<div class="grid">


<div class="card">

<h2>🧠 Memory</h2>

<p id="memoryPanel" class="status">
Waiting...
</p>

</div>



<div class="card">

<h2>🟦 Left Brain</h2>

<p id="leftPanel" class="status">
Waiting...
</p>

</div>



<div class="card">

<h2>🟪 Right Brain</h2>

<p id="rightPanel" class="status">
Waiting...
</p>

</div>



<div class="card">

<h2>🟨 Synthesis</h2>

<p id="synthesisPanel" class="status">
Waiting...
</p>

</div>



<div class="card">

<h2>🟩 Verifier</h2>

<p id="verificationPanel" class="status">
Waiting...
</p>

</div>



<div class="card">

<h2>⭐ Executive</h2>

<p id="executivePanel" class="status">
Waiting...
</p>

</div>



</div>


<script src="{{ url_for('static', filename='js/app.js') }}"></script>


</body>

</html>
